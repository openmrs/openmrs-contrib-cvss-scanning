name: Security Test Email Alerts
on:
  schedule:
    - cron: '30 2 * * MON'
  workflow_dispatch:
jobs:
  run:
    name: Send mail
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          
      - name: Download previous test results DB
        uses: dawidd6/action-download-artifact@eab87c9830c39eff17e5a6eadb20bfb4bc880477 # v27
        with:
          workflow: security-tests-and-deploy-dashboard.yml
          search_artifacts: true
          name: test-results-db
          path: .
        continue-on-error: true  # First run won't have a DB artifact yet
        
      - name: Download previous test report.json file
        uses: dawidd6/action-download-artifact@eab87c9830c39eff17e5a6eadb20bfb4bc880477 # v27
        with:
          workflow: security-tests-and-deploy-dashboard.yml
          search_artifacts: true
          name: security-test-report-json
          path: .
        continue-on-error: false

      # The download picks the most recent *successful* run, which may be old if the test workflow has been failing
      - name: Check that the test report is recent
        run: |
          python - <<'PY'
          import json, sys, time
          age_hours = (time.time() - json.load(open("report.json"))["created"]) / 3600
          if age_hours > 36:
              sys.exit(f"report.json is {age_hours:.0f} hours old; refusing to email stale results")
          PY

      - name: Prepare email body
        run: |
          python scripts/prepare_email_report.py report.json test_results.db

      #In the case of NO critical vulnerabilites, the email shouldn't be sent. 
      #The email body will contain the text "NO FAILING TESTS" Which is a flag to not send the emails
      - name: Check if email should be sent
        id: check_email
        run: |
          if grep -q "NO FAILING TESTS" email_body.html; then
            echo "should_send=false" >> $GITHUB_OUTPUT
          else
            echo "should_send=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Collect current timestamp
        id: timestamp
        run: echo "NOW=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
      
      - name: Send mail
        if: steps.check_email.outputs.should_send == 'true' && github.ref == 'refs/heads/main'
        uses: dawidd6/action-send-mail@67ce3558d613188179559c61d3565140cf389968 # v22
        with:
          #data
          # Required mail server address if not connection_url:
          server_address: ${{secrets.SMTP_SERVER}}
          # Server port, default 25:
          server_port: ${{secrets.SMTP_PORT}}
          # Optional whether this connection use TLS (default is true if server_port is 465)
          secure: false
          # Optional (recommended) mail server username:
          username: ${{secrets.MAIL_USERNAME}}
          # Optional (recommended) mail server password:
          password: ${{secrets.MAIL_PASSWORD}}
          # Required mail subject:
          subject: Automated Security Test Results ${{ steps.timestamp.outputs.NOW }}
          # Optional recipients. Separate multiple addresses by a comma (possibly surrounded by whitespace):
          to: security@openmrs.org
          # Required sender (supported formats: see "Supported address formats" below)
          from: 'OpenMRS Security Dashboard <${{secrets.MAIL_USERNAME}}>'
          # Optional plain body:
          html_body: file://email_body.html
      
          # Optional priority: 'high', 'normal' (default) or 'low'
          # priority: low
      
          # Optional custom headers:
          #headers: '{"X-Priority": "3 (Normal)", "X-My-Header": "MyValue"}'
      
          # Optional nodemailerlog: true/false
          #nodemailerlog: false
      
          # Optional nodemailerdebug: true/false if true nodemailerlog will also be set true
          #nodemailerdebug: false
      
          # Optional custom SMTP MAIL FROM address (overrides username):
          #envelope_from: mailer@example.com
      
          # Optional custom SMTP RCPT TO addresses (overrides to, cc, bcc). Separate multiple addresses by a comma (possibly surrounded by whitespace):
          #envelope_to: mailer@example.com, admin@example.com

      - name: clean up directory, remove email body
        run: |
          rm email_body.html

