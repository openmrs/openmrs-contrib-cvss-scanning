name: Security Tests & Deploy Dashboard

on:
  push:
    branches: [ main, develop ]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      skip_security_tests:
        description: 'Skip Security Tests and Only Deploy Dashboard'
        type: boolean
        default: false

jobs:
  security-tests:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_security_tests == false }}
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Starting early since OpenMRS takes time to spin up; this allows it to initialize
    # in the background while dependencies are being installed.
    - name: Start an OpenMRS instance
      run: docker compose -f docker-compose.yml up -d

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip

        echo "Searching for requirements.txt files..."
        find . -name "requirements.txt" -type f | while read req; do
          echo "Installing dependencies from: $req"
          pip install -r "$req"
        done

    - name: Install Playwright browsers
      run: |
        python -m playwright install chromium

    - name: Wait for the OpenMRS instance to start
      id: wait-for-omrs-instance
      run: while [[ "$(echo $(curl -s -o /dev/null -w '%{http_code}' http://localhost/openmrs/health/started))" != "200" ]]; do echo "$(curl -i http://localhost/openmrs/health/started)"; sleep 10; done

    - name: Run Security Tests
      id: run-security-tests
      if: always() && (steps.wait-for-omrs-instance.outcome == 'success')
      run: |
        # Run pytest and capture ALL output (including CVSS scores)
        pytest tests/ \
          --html=detailed-report.html \
          --self-contained-html \
          --json-report \
          --json-report-file=report.json \
          -v -s 2>&1 | tee test_output.log
      continue-on-error: true

    - name: Upload HTML Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: security-test-report-html
        path: detailed-report.html
        retention-days: 30

    - name: Upload JSON Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: security-test-report-json
        path: report.json
        retention-days: 30

    - name: Upload Test Output
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: security-test-output
        path: test_output.log
        retention-days: 30

    - name: Comment on PR
      if: ${{ github.event_name == 'pull_request' && github.repository_owner == 'openmrs' }}
      continue-on-error: true
      uses: actions/github-script@v7
      with:
        script: |
          const summary = '## 🔒 Security Test Results\n\nTests completed. View the [security dashboard](https://cvss-report.openmrs.org) for detailed CVSS scores and trends.\n\n📊 [Download artifacts](../actions/runs/${{ github.run_id }})';

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: summary
          });

    - name: Capture Server Logs
      if: always()
      uses: jwalton/gh-docker-logs@v2
      with:
        dest: "./logs"

    - name: Upload Logs as Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: server-logs
        path: "./logs"
        retention-days: 2
        overwrite: true
  
  deploy-dashboard:
    needs: security-tests
    if: always()
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip

        echo "Searching for requirements.txt files..."
        find . -name "requirements.txt" -type f | while read req; do
          echo "Installing dependencies from: $req"
          pip install -r "$req"
        done
    
    - name: Download previous test results DB
      uses: dawidd6/action-download-artifact@v6
      with:
        name: test-results-db
        path: .
      continue-on-error: true  # First run won't have a DB artifact yet
    
    - name: Download JSON Report
      id: download-json
      uses: dawidd6/action-download-artifact@v6
      with:
        name: security-test-report-json
        path: .
        run_id: ${{ github.run_id }} # looks for current run
      continue-on-error: true

    - name: Download JSON Report (fallback to last successful run)
      if: steps.download-json.outcome == 'failure'
      uses: dawidd6/action-download-artifact@v6
      with:
        name: security-test-report-json
        search_artifacts: true
        path: .
    
    - name: Download HTML Report
      id: download-html
      uses: dawidd6/action-download-artifact@v6
      with:
        name: security-test-report-html
        path: .
        run_id: ${{ github.run_id }} # looks for current run
      continue-on-error: true

    - name: Download HTML Report (fallback to last successful run)
      if: steps.download-html.outcome == 'failure'
      uses: dawidd6/action-download-artifact@v6
      with:
        name: security-test-report-html
        search_artifacts: true
        path: .
    
    # get last 10 successful test runs to add as snapshots
    - name: Download last 10 successful full-suite runs on main
      id: get-snapshots
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        mkdir -p snapshots
        COUNT=0

        RUN_IDS=$(gh run list \
          --repo "${{ github.repository }}" \
          --workflow "${{ github.workflow }}" \
          --branch main \
          --status success \
          --limit 50 \
          --json databaseId --jq '.[].databaseId')

        for RUN_ID in $RUN_IDS; do
          if [ "$COUNT" -ge 10 ]; then
            break
          fi

          JOB_STATUS=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/jobs" \
            --jq '.jobs[] | select(.name == "security-tests") | .conclusion')

          if [ "$JOB_STATUS" != "success" ]; then
            echo "Skipping run $RUN_ID (security-tests job didn't run/succeed)"
            continue
          fi

          # Get the run's creation date for the snapshot folder name
          CREATED_AT=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID" --jq '.created_at')
          TIMESTAMP=$(date -u -d "$CREATED_AT" +"%Y-%m-%dT%H-%M-%SZ")
          SNAPSHOT_DIR="snapshots/${TIMESTAMP}_${RUN_ID}"

          mkdir -p "$SNAPSHOT_DIR"
          if gh run download "$RUN_ID" \
              --repo "${{ github.repository }}" \
              -n security-dashboard \
              -D "$SNAPSHOT_DIR"; then
            echo "Included run $RUN_ID -> $SNAPSHOT_DIR"
            COUNT=$((COUNT + 1))
          else
            echo "Artifact expired or missing for run $RUN_ID, removing empty dir"
            rmdir "$SNAPSHOT_DIR" 2>/dev/null || true
          fi
        done

        echo "Collected $COUNT snapshots into ./snapshots"
    
    - name: Extract CVSS Scores and Generate Dashboard
      if: always()
      run: python scripts/generate_security_dashboard.py

    - name: Upload test results DB
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-db
        path: test_results.db
        retention-days: 90
        overwrite: true

    - name: Upload Security Dashboard
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: security-dashboard
        path: |
          security_dashboard.html
          assets/security_dashboard.css
          assets/pie_chart.css
        retention-days: 30
      
    - name: Prepare GitHub Pages Deployment
      if: github.ref == 'refs/heads/main'
      run: |
        mkdir -p gh-pages
        mkdir -p gh-pages/assets
        cp security_dashboard.html gh-pages/index.html
        cp detailed-report.html gh-pages/detailed-report.html
        cp -r assets/. gh-pages/assets

        # copy all files in snapshots
        mkdir -p gh-pages/snapshots
        cp -r snapshots/. gh-pages/snapshots

    - name: Deploy to GitHub Pages
      if: github.ref == 'refs/heads/main'
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./gh-pages
        cname: security-dashboard.openmrs.org
        keep_files: false
