name: Security Tests & Deploy Dashboard

on:
  push:
    branches: [ main, develop ]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      skip_security_tests:
        description: 'Skip Security Tests and Only Deploy Dashboard'
        type: boolean
        default: false

jobs:
  security-tests:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_security_tests == false }}
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # Starting early since OpenMRS takes time to spin up; this allows it to initialize
    # in the background while dependencies are being installed.
    - name: Start an OpenMRS instance
      run: docker compose -f docker-compose.yml up -d

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip

        echo "Searching for requirements.txt files..."
        find . -name "requirements.txt" -type f | while read req; do
          echo "Installing dependencies from: $req"
          pip install -r "$req"
        done

    - name: Install Playwright browsers
      run: |
        python -m playwright install chromium

    - name: Wait for the OpenMRS instance to start
      id: wait-for-omrs-instance
      run: while [[ "$(echo $(curl -s -o /dev/null -w '%{http_code}' http://localhost/openmrs/health/started))" != "200" ]]; do echo "$(curl -i http://localhost/openmrs/health/started)"; sleep 10; done

    - name: Run Security Tests
      id: run-security-tests
      if: always() && (steps.wait-for-omrs-instance.outcome == 'success')
      run: |
        # Run pytest and capture ALL output (including CVSS scores)
        pytest tests/ \
          --html=detailed-report.html \
          --self-contained-html \
          --json-report \
          --json-report-file=report.json \
          -v -s 2>&1 | tee test_output.log
      continue-on-error: true

    - name: Upload HTML Report
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: security-test-report-html
        path: detailed-report.html
        retention-days: 30

    - name: Upload JSON Results
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: security-test-report-json
        path: report.json
        retention-days: 30

    - name: Upload Test Output
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: security-test-output
        path: test_output.log
        retention-days: 30

    - name: Comment on PR
      if: ${{ github.event_name == 'pull_request' && github.repository_owner == 'openmrs' }}
      continue-on-error: true
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          const summary = '## 🔒 Security Test Results\n\nTests completed. View the [security dashboard](https://cvss-report.openmrs.org) for detailed CVSS scores and trends.\n\n📊 [Download artifacts](../actions/runs/${{ github.run_id }})';

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: summary
          });

    - name: Capture Server Logs
      if: always()
      run: |
        mkdir -p logs
        for svc in $(docker compose -f docker-compose.yml config --services); do
          docker compose -f docker-compose.yml logs --no-color --timestamps "$svc" > "logs/${svc}.log"
        done

    - name: Upload Logs as Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: always()
      with:
        name: server-logs
        path: "./logs"
        retention-days: 2
        overwrite: true
  
  deploy-dashboard:
    needs: security-tests
    if: always()
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip

        echo "Searching for requirements.txt files..."
        find . -name "requirements.txt" -type f | while read req; do
          echo "Installing dependencies from: $req"
          pip install -r "$req"
        done
    
    - name: Download previous test results DB
      uses: dawidd6/action-download-artifact@eab87c9830c39eff17e5a6eadb20bfb4bc880477 # v27
      with:
        name: test-results-db
        path: .
      continue-on-error: true  # First run won't have a DB artifact yet
    
    - name: Download JSON Report
      id: download-json
      uses: dawidd6/action-download-artifact@eab87c9830c39eff17e5a6eadb20bfb4bc880477 # v27
      with:
        name: security-test-report-json
        path: .
        run_id: ${{ github.run_id }} # looks for current run
      continue-on-error: true

    - name: Download JSON Report (fallback to last successful run)
      if: steps.download-json.outcome == 'failure'
      uses: dawidd6/action-download-artifact@eab87c9830c39eff17e5a6eadb20bfb4bc880477 # v27
      with:
        name: security-test-report-json
        search_artifacts: true
        path: .
    
    - name: Download HTML Report
      id: download-html
      uses: dawidd6/action-download-artifact@eab87c9830c39eff17e5a6eadb20bfb4bc880477 # v27
      with:
        name: security-test-report-html
        path: .
        run_id: ${{ github.run_id }} # looks for current run
      continue-on-error: true

    - name: Download HTML Report (fallback to last successful run)
      if: steps.download-html.outcome == 'failure'
      uses: dawidd6/action-download-artifact@eab87c9830c39eff17e5a6eadb20bfb4bc880477 # v27
      with:
        name: security-test-report-html
        search_artifacts: true
        path: .
    
    - name: Extract CVSS Scores and Generate Dashboard
      if: always()
      run: python scripts/generate_security_dashboard.py

    - name: Upload test results DB
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: test-results-db
        path: test_results.db
        retention-days: 90
        overwrite: true

    - name: Upload Security Dashboard
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: security-dashboard
        path: |
          security_dashboard.html
          security_dashboard_spreadsheet_view.html
          assets/security_dashboard.css
          assets/pie_chart.css
          assets/js/security_dashboard.js
          assets/js/security_dashboard_spreadsheet_view.js
          assets/js/utils.js
        retention-days: 30
      
    - name: Prepare GitHub Pages Deployment
      if: github.ref == 'refs/heads/main'
      run: |
        mkdir -p gh-pages/assets/js
        cp security_dashboard.html gh-pages/index.html
        cp security_dashboard_spreadsheet_view.html gh-pages/security_dashboard_spreadsheet_view.html
        cp detailed-report.html gh-pages/detailed-report.html
        cp assets/security_dashboard.css gh-pages/assets/security_dashboard.css
        cp assets/pie_chart.css gh-pages/assets/pie_chart.css
        cp assets/js/security_dashboard.js gh-pages/assets/js/security_dashboard.js
        cp assets/js/security_dashboard_spreadsheet_view.js gh-pages/assets/js/security_dashboard_spreadsheet_view.js
        cp assets/js/utils.js gh-pages/assets/js/utils.js

    - name: Deploy to GitHub Pages
      if: github.ref == 'refs/heads/main'
      uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./gh-pages
        cname: security-dashboard.openmrs.org
        keep_files: false

  # Posts the daily summary to Slack. Only reads artifacts from this run, so it can never report stale results.
  notify-slack:
    needs: [security-tests, deploy-dashboard]
    if: ${{ always() && github.event_name == 'schedule' && needs.security-tests.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.11'

    - name: Download JSON Report
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: security-test-report-json
        path: .

    - name: Download test results DB
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: test-results-db
        path: .

    - name: Parse test results for Slack notification
      id: parse-results
      run: |
        python - <<'PY' >> "$GITHUB_OUTPUT"
        import json, sys
        summary = json.load(open("report.json"))["summary"]
        if summary.get("total", 0) == 0:
            sys.exit("report.json contains no test results")
        # pytest-json-report omits outcome keys with a zero count
        print(f"failure_count={summary.get('failed', 0)}")
        PY

        NEW_CATEGORIES=$(python scripts/slack_report_generator.py report.json test_results.db)
        {
          echo "new_categories<<EOF"
          echo "${NEW_CATEGORIES}"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Share results with a channel
      uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
      with:
        webhook: ${{ secrets.SLACK_NOTIFICATION_WEBHOOK_URL }}
        webhook-type: webhook-trigger
        payload: |
          {
          "failure_count": "${{ steps.parse-results.outputs.failure_count }}",
          "new_categories": ${{ toJSON(steps.parse-results.outputs.new_categories) }}
          }

  # Alerts when any part of the pipeline breaks (including the Slack summary), so a stale dashboard doesn't go unnoticed.
  notify-failure:
    needs: [security-tests, deploy-dashboard, notify-slack]
    if: ${{ (failure() || cancelled()) && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest

    steps:
    - name: Send failure alert to Slack
      uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
      with:
        webhook: ${{ secrets.SLACK_FAILURE_WEBHOOK_URL }}
        webhook-type: incoming-webhook
        payload: |
          {
          "text": ${{ toJSON(format(':rotating_light: *{0}* did not complete on `{1}` (security-tests: {2}, deploy-dashboard: {3}, notify-slack: {4}). The security dashboard may be stale. {5}/{6}/actions/runs/{7}', github.workflow, github.ref_name, needs.security-tests.result, needs.deploy-dashboard.result, needs.notify-slack.result, github.server_url, github.repository, github.run_id)) }}
          }
